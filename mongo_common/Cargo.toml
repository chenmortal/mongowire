[package]
name = "mongo_common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Base primitives for the MongoDB wire protocol: constants, protocol IO helpers, CRC-32C, BSON scalar types and SCRAM authentication"

[features]
default = []
# Uuid <-> Binary(subtype 4) conversions
uuid = ["dep:uuid"]
# Decimal128 <-> rust_dec::Decimal conversions
decimal128-convert = ["dep:dec"]

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
crc32c = { workspace = true }
hmac = { workspace = true }
md-5 = "0.10"
sha1 = { workspace = true }
sha2 = { workspace = true }
pbkdf2 = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true, optional = true }
dec = { workspace = true, optional = true }
