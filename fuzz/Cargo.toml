[package]
name = "mongowire-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mongo_common = { path = "../mongo_common" }
mongowire = { path = "../mongowire" }
wirebson = { path = "../wirebson" }
bytes = "1"

# Keep the parent workspace out: this crate is built by `cargo fuzz` with
# its own flags (sancov / libFuzzer), not as a workspace member.
[workspace]

[[bin]]
name = "fuzz_msg"
path = "fuzz_targets/fuzz_msg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_document"
path = "fuzz_targets/fuzz_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_macros"
path = "fuzz_targets/fuzz_macros.rs"
test = false
doc = false
bench = false
